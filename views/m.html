<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16264A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" href="/icons/icon-96.png">
<title>RepRoute</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#16264A; --navy-2:#0B1630; --gold:#F2B233; --bg:#F4F5F7; --card:#FFFFFF;
  --ink:#111827; --muted:#5B6474; --line:#E3E6EB; --chip:#E8EBF1; --field:#CBD1DA;
  --warn-bg:#FFEDD5; --warn:#9A3412; --ok-bg:#DCFCE7; --ok:#166534; --bad-bg:#FEE2E2; --bad:#991B1B;
  --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  font-size:16px;line-height:1.35;-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
/* 16px in every field: below that, iPhone zooms the page when you tap in. */
input,select,textarea{font-size:16px;width:100%;min-height:48px;padding:12px 14px;border:1px solid var(--field);
  border-radius:10px;background:#fff;outline:none;-webkit-appearance:none;appearance:none}
textarea{min-height:96px;resize:vertical}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}
input:focus,select:focus,textarea:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(22,38,74,.15)}
a{color:var(--navy)}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Shell */
#top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:calc(10px + var(--safe-t)) 16px 10px;
  display:flex;align-items:center;gap:10px;min-height:56px}
#top h1{font-size:18px;font-weight:700;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:44px;height:44px;border:none;background:transparent;color:inherit;border-radius:22px;display:inline-flex;
  align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.icon-btn:active{background:rgba(255,255,255,.12)}
#view{padding:16px 16px calc(110px + var(--safe-b));max-width:720px;margin:0 auto}
nav#tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-around;padding:6px 6px calc(6px + var(--safe-b));height:calc(70px + var(--safe-b))}
nav#tabs a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:500;color:var(--muted);
  text-decoration:none;min-width:60px;min-height:48px;justify-content:center;border-radius:10px}
nav#tabs a.on{color:var(--navy);font-weight:700}
nav#tabs a.log{width:58px;height:58px;min-width:58px;border-radius:29px;background:var(--gold);color:var(--ink);margin-top:-26px;
  box-shadow:0 4px 14px rgba(0,0,0,.18)}
nav#tabs svg{width:23px;height:23px}

/* Pieces */
.h2{font-size:16px;font-weight:700;margin:20px 0 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.h2:first-child{margin-top:0}
.h2 a,.h2 button.link{font-size:14px;font-weight:600;text-decoration:none;background:none;border:none;color:var(--navy);padding:8px 0;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px}
.list>*{padding:14px;border-bottom:1px solid var(--line)}
.list>*:last-child{border-bottom:none}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.t1{font-size:16px;font-weight:600;overflow-wrap:anywhere}
.t2{font-size:14px;color:var(--muted)}
.t3{font-size:14px;color:var(--navy);margin-top:3px}
.tap{display:block;text-decoration:none;color:inherit;cursor:pointer}
.tap:active{background:#F7F8FA}
.tap.row{display:flex}
.rowbtn{width:100%;border:none;background:none;text-align:left;font:inherit;color:inherit;cursor:pointer;padding:14px}
.list>.rowbtn{border-bottom:1px solid var(--line)}
.list>.rowbtn:last-child{border-bottom:none}
.btn{height:48px;padding:0 16px;border-radius:10px;border:1px solid var(--field);background:#fff;font-weight:600;font-size:15px;
  color:var(--navy);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;white-space:nowrap}
.btn.sm{height:40px;font-size:14px;padding:0 12px}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--ink);font-weight:700}
.btn.danger{color:var(--bad);border-color:#FECACA}
.btn:disabled{opacity:.55}
.btns{display:flex;gap:8px}
.btns>.btn{flex:1}
.circle{width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:#fff;color:var(--navy);display:inline-flex;
  align-items:center;justify-content:center;flex-shrink:0;text-decoration:none}
.num{width:30px;height:30px;border-radius:15px;background:var(--chip);color:var(--navy);font-size:14px;font-weight:700;
  display:flex;align-items:center;justify-content:center;flex-shrink:0}
.num.done{background:var(--ok-bg);color:var(--ok)}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 8px;border-radius:8px;background:#EEF0F3;color:var(--muted);white-space:nowrap}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.navy{background:var(--chip);color:var(--navy)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:8px 14px;border-radius:20px;border:1px solid var(--field);background:#fff;font-size:14px;font-weight:500;cursor:pointer}
.chip[aria-pressed="true"]{border:2px solid var(--navy);background:var(--chip);color:var(--navy);font-weight:700;padding:7px 13px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.opt{min-height:52px;border-radius:10px;border:1px solid var(--field);background:#fff;font-size:14px;font-weight:600;cursor:pointer;padding:8px}
.opt[aria-pressed="true"]{border:2px solid var(--navy);background:var(--chip);color:var(--navy)}
.seg{display:flex;background:#E9ECF1;border-radius:10px;padding:3px;gap:2px}
.seg button{flex:1;min-height:40px;border:none;background:transparent;border-radius:8px;font-size:14px;font-weight:500;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:#fff;color:var(--navy);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field>label,.lbl{font-size:13px;font-weight:600;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:rgba(255,255,255,.1);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:22px}
.stat span{font-size:12px;color:#C7D0E0}
.hero{background:var(--navy);color:#fff;margin:-16px -16px 16px;padding:8px 16px 18px}
.hero .date{font-size:13px;color:#C7D0E0}
.hero .hi{font-size:24px;font-weight:700;margin:2px 0 12px}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.kpi{padding:12px 14px}
.kpi b{display:block;font-size:22px}
.kpi span{font-size:13px;color:var(--muted)}
.bars{display:flex;align-items:flex-end;gap:6px;height:96px;border-bottom:1px solid var(--line);padding-top:6px}
.bars div{flex:1;background:#B9C3D6;border-radius:4px 4px 0 0;min-height:2px;position:relative}
.bars div:last-child{background:var(--navy)}
.bars div span{position:absolute;top:-18px;left:0;right:0;text-align:center;font-size:11px;color:var(--muted)}
.blabels{display:flex;gap:6px;font-size:11px;color:var(--muted);margin-top:4px}
.blabels span{flex:1;text-align:center;white-space:nowrap;overflow:hidden}
.hbar{height:8px;border-radius:4px;background:#EEF0F3;overflow:hidden;margin-top:6px}
.hbar i{display:block;height:100%;background:var(--navy);border-radius:4px}
.empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:15px}
.empty .btn{margin-top:12px}
.err{padding:18px;text-align:center;color:var(--bad);font-size:15px}
.skel{height:76px;border-radius:14px;background:linear-gradient(90deg,#ECEEF2,#F6F7F9,#ECEEF2);background-size:200% 100%;animation:sk 1.2s infinite;margin-bottom:10px}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
.search{position:relative}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search input{padding-left:42px}
.dd{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:15;background:#fff;border:1px solid var(--line);border-radius:12px;
  box-shadow:0 10px 30px rgba(0,0,0,.12);max-height:300px;overflow:auto}
.dd button{display:block;width:100%;text-align:left;border:none;background:#fff;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.mic{position:absolute;right:8px;bottom:8px;width:44px;height:44px;border-radius:22px;border:none;background:var(--gold);color:var(--ink);
  display:flex;align-items:center;justify-content:center;cursor:pointer}
.mic.rec{background:#DC2626;color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(220,38,38,.2)}}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:35;background:#fff;border-top:1px solid var(--line);padding:12px 16px calc(12px + var(--safe-b))}
.savebar .btn{width:100%;height:54px;font-size:17px}

/* Sheet + toast */
#scrim{position:fixed;inset:0;background:rgba(17,24,39,.4);z-index:50}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:#fff;border-radius:18px 18px 0 0;max-height:88vh;overflow:auto;
  padding:8px 16px calc(20px + var(--safe-b));box-shadow:0 -8px 30px rgba(0,0,0,.15)}
#sheet .grab{width:40px;height:5px;border-radius:3px;background:#D5D9E0;margin:4px auto 12px}
#sheet h2{font-size:19px;margin:0 0 14px}
#toast{position:fixed;left:16px;right:16px;top:calc(64px + var(--safe-t));z-index:60;background:var(--ink);color:#fff;border-radius:12px;
  padding:14px 16px;font-weight:600;font-size:15px;text-align:center;opacity:0;transform:translateY(-10px);box-shadow:0 6px 20px rgba(0,0,0,.2);transition:.2s;pointer-events:none}
#toast.show{opacity:1;transform:none}
#toast.bad{background:#7F1D1D}
#offline{background:#FEF3C7;color:#92400E;font-size:14px;font-weight:600;text-align:center;padding:8px 12px}
.menu a,.menu button{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:0 4px;border:none;background:none;
  border-bottom:1px solid var(--line);font-size:16px;color:var(--ink);text-decoration:none;cursor:pointer;text-align:left}
.menu a:last-child,.menu button:last-child{border-bottom:none}
.agent{border:1px solid #C7D2FE;background:#EEF2FF;border-radius:14px;padding:14px;margin-top:12px}
.agent textarea{background:#fff;min-height:160px}
</style>
</head>
<body>
<div id="offline" class="hidden" role="status">You're offline. Visits you log are saved and will send when you're back.</div>
<header id="top">
  <button class="icon-btn hidden" id="back" aria-label="Back" onclick="history.back()">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
  </button>
  <h1 id="title">RepRoute</h1>
  <button class="icon-btn" aria-label="More" onclick="openMore()">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
</header>
<main id="view" tabindex="-1"></main>
<nav id="tabs" aria-label="Main">
  <a href="#today" data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Today</a>
  <a href="#accounts" data-tab="accounts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21V8l9-5 9 5v13"/><path d="M9 21v-6h6v6"/></svg>Accounts</a>
  <a href="#log" data-tab="log" class="log" aria-label="Log a visit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></a>
  <a href="#pipeline" data-tab="pipeline"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h11M4 18h6"/></svg>Pipeline</a>
  <a href="#reports" data-tab="reports"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 20V4M4 20h16M8 16v-5M12 16V8M16 16v-3"/></svg>Reports</a>
</nav>
<div id="scrim" class="hidden" onclick="closeSheet()"></div>
<div id="sheet" class="hidden" role="dialog" aria-modal="true"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
// ════════════════════════════════════════════════════════════════
// RepRoute phone app. Hash routes: #today #accounts #account/ID #log[/ID]
// #pipeline #reports. Every screen loads with one request.
// ════════════════════════════════════════════════════════════════
var LINES = ['Soudal', 'ShurTape', 'Alum-A-Pole', 'Fortress'];
var OUTCOMES = [
  ['Dropped In - Interested', 'Met, interested'], ['Ready to Order', 'Ready to order'],
  ['Left Sample', 'Left samples'], ['Follow-up Needed', 'Needs follow-up'],
  ['Order Placed', 'Order placed'], ['Dropped In - Not Interested', 'Not interested'],
  ['Not Available', 'Buyer not in'], ['Left Voicemail', 'Left voicemail']
];
var ME = null, TEAM = null;
var $ = function (s, r) { return (r || document).querySelector(s); };
var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function ymd(d) { d = d || new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function addDays(s, n) { var p = s.split('-'); var d = new Date(+p[0], +p[1] - 1, +p[2]); d.setDate(d.getDate() + n); return ymd(d); }
var MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
function fmtDate(s) { if (!s) return ''; s = String(s).slice(0, 10); var p = s.split('-'); var t = ymd();
  if (s === t) return 'Today'; if (s === addDays(t, 1)) return 'Tomorrow'; if (s === addDays(t, -1)) return 'Yesterday';
  return MON[+p[1] - 1] + ' ' + (+p[2]) + (p[0] !== t.slice(0, 4) ? ', ' + p[0] : ''); }
function money(n) { n = Number(n) || 0; return '$' + (n >= 10000 ? Math.round(n / 1000) + 'k' : n.toLocaleString('en-US', { maximumFractionDigits: 0 })); }
function digits(p) { return String(p || '').replace(/[^\d+]/g, ''); }
function fmtPhone(p) { var d = String(p || '').replace(/\D/g, ''); if (d.length === 11 && d[0] === '1') d = d.slice(1);
  return d.length === 10 ? '(' + d.slice(0, 3) + ') ' + d.slice(3, 6) + '-' + d.slice(6) : (p || ''); }
function mapsUrl(a) { var q = encodeURIComponent([a.address, a.company, a.city, a.state].filter(Boolean).join(', '));
  return /iPhone|iPad|iPod/.test(navigator.userAgent) ? 'https://maps.apple.com/?q=' + q : 'https://www.google.com/maps/search/?api=1&query=' + q; }
function plural(n, w) { return n + ' ' + w + (n === 1 ? '' : 's'); }
function firstName(n) { return String(n || '').trim().split(/\s+/)[0] || ''; }

// ── Network ──────────────────────────────────────────────────────
function api(url, opts) {
  opts = opts || {};
  var init = { method: opts.method || 'GET', headers: {}, credentials: 'same-origin' };
  if (opts.body !== undefined) { init.headers['Content-Type'] = 'application/json'; init.body = JSON.stringify(opts.body); }
  return fetch(url, init).then(function (r) {
    // Some /api routes answer an expired session by redirecting to the login
    // page (200 HTML). Treat that as signed out, never as a successful save.
    var ct = r.headers.get('content-type') || '';
    if (r.status === 401 || r.redirected || (r.ok && ct.indexOf('application/json') < 0 && ct.indexOf('text/csv') < 0)) {
      var e0 = new Error('You were signed out. Sign in again and your visit will send.'); e0.status = 401; e0.signedOut = true;
      setTimeout(function () { location.href = '/'; }, 1800); throw e0;
    }
    return r.json().catch(function () { return {}; }).then(function (j) {
      if (!r.ok) { var e = new Error(j.error || ('Error ' + r.status)); e.status = r.status; e.body = j; throw e; }
      return j;
    });
  });
}

// Offline queue for visits: a save that can't reach the server is kept on the
// phone and sent later. client_ref makes the retry idempotent on the server.
var QKEY = 'rr_visit_queue_v1';
function readQ() { try { return JSON.parse(localStorage.getItem(QKEY) || '[]'); } catch (e) { return []; } }
function writeQ(q) { try { localStorage.setItem(QKEY, JSON.stringify(q)); } catch (e) {} }
function flushQ() {
  var q = readQ(); if (!q.length || !navigator.onLine) return Promise.resolve();
  var item = q[0];
  return api('/api/calls', { method: 'POST', body: item.call }).then(function () {
    var sample = item.sample ? api('/api/samples', { method: 'POST', body: item.sample }) : Promise.resolve();
    return sample.catch(function () {}).then(function () {
      writeQ(readQ().filter(function (x) { return x.call.client_ref !== item.call.client_ref; }));
      if (item.stop) api('/api/m/stops/' + item.stop + '/done', { method: 'POST' }).catch(function () {});
      toast('Saved your offline visit');
      return flushQ();
    });
  }).catch(function (e) {
    // Network still down or signed out: keep it for later. A real rejection
    // (account deleted, bad data) is moved aside so later visits still send.
    if (e && e.status && !e.signedOut) {
      writeQ(readQ().filter(function (x) { return x.call.client_ref !== item.call.client_ref; }));
      try { var bad = JSON.parse(localStorage.getItem('rr_visit_failed_v1') || '[]'); bad.push(item); localStorage.setItem('rr_visit_failed_v1', JSON.stringify(bad)); } catch (x) {}
      toast('One offline visit couldn\'t be saved: ' + e.message, true);
      return flushQ();
    }
  });
}
function setOnline() { $('#offline').classList.toggle('hidden', navigator.onLine); if (navigator.onLine) flushQ(); }
window.addEventListener('online', setOnline); window.addEventListener('offline', setOnline);

// ── UI helpers ───────────────────────────────────────────────────
var toastT;
function toast(msg, bad) { var t = $('#toast'); t.textContent = msg; t.className = 'show' + (bad ? ' bad' : ''); clearTimeout(toastT);
  toastT = setTimeout(function () { t.className = bad ? 'bad' : ''; }, bad ? 4000 : 2400); }
function openSheet(html) { $('#sheet').innerHTML = '<div class="grab"></div>' + html; $('#sheet').classList.remove('hidden'); $('#scrim').classList.remove('hidden');
  var f = $('#sheet input, #sheet textarea'); if (f) setTimeout(function () { try { f.focus(); } catch (e) {} }, 60); }
function closeSheet() { $('#sheet').classList.add('hidden'); $('#scrim').classList.add('hidden'); $('#sheet').innerHTML = ''; }
function setTitle(t, back) { $('#title').textContent = t; $('#back').classList.toggle('hidden', !back); document.title = t + ' · RepRoute'; }
function view(html) { var v = $('#view'); v.innerHTML = html; }
function skeleton(n) { var h = ''; for (var i = 0; i < (n || 4); i++) h += '<div class="skel"></div>'; view(h); }
function failed(err, retry) { view('<div class="card err">Couldn\'t load this. ' + esc(err && err.message || '') +
  '<div style="margin-top:12px"><button class="btn pri" onclick="' + retry + '">Try again</button></div></div>'); }
function press(btn, group) { $$('[data-group="' + group + '"]').forEach(function (b) { b.setAttribute('aria-pressed', b === btn ? 'true' : 'false'); }); }
function toggle(btn) { btn.setAttribute('aria-pressed', btn.getAttribute('aria-pressed') === 'true' ? 'false' : 'true'); }

// ── Router ───────────────────────────────────────────────────────
var ROUTES = { today: showToday, accounts: showAccounts, account: showAccount, log: showLog, pipeline: showPipeline, reports: showReports, leads: showLeads };
var current = '';
function route() {
  var h = (location.hash || '#today').slice(1); var parts = h.split('?')[0].split('/'); var name = parts[0] || 'today';
  if (!ROUTES[name]) name = 'today';
  closeSheet(); stopDictation();
  var tab = name === 'account' ? 'accounts' : name === 'leads' ? 'today' : name;
  $$('nav#tabs a').forEach(function (a) { a.classList.toggle('on', a.dataset.tab === tab); a.setAttribute('aria-current', a.dataset.tab === tab ? 'page' : 'false'); });
  $('#tabs').classList.toggle('hidden', name === 'log');
  if (current !== h) window.scrollTo(0, 0);
  current = h;
  ROUTES[name](parts.slice(1));
}
window.addEventListener('hashchange', route);

function showToday() {
  setTitle('Today'); skeleton(4);
  api('/api/m/today?date=' + ymd()).then(function (d) {
    var now = new Date();
    var greet = now.getHours() < 12 ? 'Morning' : now.getHours() < 17 ? 'Afternoon' : 'Evening';
    var dateStr = now.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
    var h = '<div class="hero"><div class="date">' + esc(dateStr) + '</div><div class="hi">' + greet + ', ' + esc(firstName(d.name)) + '</div>' +
      '<div class="stats"><div class="stat"><b>' + d.counts.stops + '</b><span>stops</span></div>' +
      '<div class="stat"><b>' + d.counts.followups + '</b><span>follow-ups due</span></div>' +
      '<div class="stat"><b>' + d.logged_today + '</b><span>logged today</span></div></div></div>';

    h += '<div id="brief-box"></div>';
    var leadCity = (d.stops.filter(function (x) { return x.city; })[0] || {}).city || (ME && ME.territory) || '';
    h += '<a class="card tap row" href="#leads" style="padding:14px;margin-top:12px;text-decoration:none">' +
      '<div class="circle" style="background:var(--gold);border-color:var(--gold);color:var(--ink)">' + ICON.search + '</div>' +
      '<div class="grow"><div class="t1">Find new leads</div><div class="t2">' + (leadCity ? 'Distributors and contractors near ' + esc(leadCity) : 'Distributors and contractors near you') + '</div></div>' + ICON.chev + '</a>';
    window._leadCityDefault = leadCity;
    if (ME && ME.role === 'manager') h += '<div id="team-box"></div>';
    // Stops
    h += '<div class="h2">Today\'s stops<a href="#accounts">+ Add stop</a></div>';
    if (!d.stops.length) {
      h += '<div class="card empty">No stops planned for today.<br><a class="btn pri" href="#accounts">Add an account to today</a>' +
        '<div style="margin-top:10px"><a href="/app?full=1">Or plan the week on the full site</a></div></div>';
    } else {
      h += '<div class="card list">' + d.stops.map(function (s, i) {
        var done = !!s.completed_at;
        var title = s.company || s.note || 'Stop';
        var inner = '<div class="row"><div class="num' + (done ? ' done' : '') + '">' + (done ? '✓' : (i + 1)) + '</div><div class="grow">' +
          '<div class="t1">' + esc(title) + '</div><div class="t2">' + esc([s.appt_time, s.city].filter(Boolean).join(' · ')) + '</div>' +
          (s.next_step ? '<div class="t3">' + esc(s.next_step) + '</div>' : '') + '</div></div>';
        var acts = s.account_id ? '<div class="btns" style="margin-top:10px">' +
          (s.phone ? '<a class="btn sm" href="tel:' + esc(digits(s.phone)) + '">Call</a>' : '') +
          '<a class="btn sm" href="' + esc(mapsUrl(s)) + '" target="_blank" rel="noopener">Directions</a>' +
          '<a class="btn sm ' + (done ? '' : 'pri') + '" href="#log/' + s.account_id + '?stop=' + s.id + '">' + (done ? 'Log again' : 'Log visit') + '</a></div>' : '';
        var rm = '<button class="circle" style="width:36px;height:36px;border-radius:18px" aria-label="Remove this stop" onclick="removeStop(' + s.id + ',this)">' +
          '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>';
        return '<div><div class="row"><div class="grow">' + (s.account_id ? '<a class="tap" href="#account/' + s.account_id + '">' + inner + '</a>' : inner) + '</div>' + (done ? '' : rm) + '</div>' + acts + '</div>';
      }).join('') + '</div>';
    }

    // Follow-ups
    if (d.followups.length) {
      h += '<div class="h2">Follow-ups</div><div class="card list">' + d.followups.slice(0, 12).map(function (f) {
        var t = ymd(); var cls = f.due < t ? 'bad' : f.due === t ? 'warn' : '';
        return '<div><a class="tap row" href="#account/' + f.prospect_id + '"><div class="grow"><div class="t1">' + esc(f.company) + '</div>' +
          '<div class="t2">' + esc(f.next_step || 'Follow up') + (f.contact ? ' · ' + esc(f.contact) : '') + '</div></div>' +
          '<span class="pill ' + cls + '">' + (f.due < t ? 'Overdue' : esc(fmtDate(f.due))) + '</span></a>' +
          '<div class="btns" style="margin-top:10px">' +
          (f.phone ? '<a class="btn sm" href="tel:' + esc(digits(f.phone)) + '">Call</a>' : '') +
          '<button class="btn sm" onclick="followup(' + f.id + ',\'snooze\',7,this)">Push 1 week</button>' +
          '<button class="btn sm" onclick="followup(' + f.id + ',\'done\',0,this)">Done</button></div></div>';
      }).join('') + '</div>';
    }
    // Quote follow-ups
    if (d.quote_followups.length) {
      h += '<div class="h2">Quotes to chase</div><div class="card list">' + d.quote_followups.map(function (q) {
        var late = q.due < ymd(); q.follow_up_date = q.due; reg('q', q);
        return '<button class="tap row rowbtn" onclick="quoteSheet(' + q.id + ')"><div class="grow"><div class="t1">' + esc(q.account_name) + '</div>' +
          '<div class="t2">' + esc([q.products, q.amount ? money(q.amount) : ''].filter(Boolean).join(' · ')) + '</div></div>' +
          '<span class="pill ' + (late ? 'bad' : 'warn') + '">' + (late ? 'Overdue' : esc(fmtDate(q.due))) + '</span></button>';
      }).join('') + '</div>';
    }
    // Samples
    if (d.samples.length) {
      h += '<div class="h2">Samples out</div><div class="card list">' + d.samples.slice(0, 8).map(function (s) {
        var late = s.due && s.due < ymd(); s.follow_up_date = s.due; reg('s', s);
        return '<button class="tap row rowbtn" onclick="sampleSheet(' + s.id + ')"><div class="grow"><div class="t1">' + esc(s.company || 'Account') + '</div>' +
          '<div class="t2">' + esc(s.product_line) + ' · left ' + esc(fmtDate(s.sent_date)) + '</div></div>' +
          (s.due ? '<span class="pill ' + (late ? 'bad' : '') + '">' + (late ? 'Check in' : esc(fmtDate(s.due))) + '</span>' : '') + '</button>';
      }).join('') + '</div>';
    }
    if (!d.followups.length && !d.samples.length && !d.quote_followups.length) {
      h += '<div class="h2">Follow-ups</div><div class="card empty">Nothing due. Nice.</div>';
    }
    view(h);
    loadBrief(false);
    if (ME && ME.role === 'manager') loadTeamBox();
  }).catch(function (e) { failed(e, 'route()'); });
}

  var el = $('#team-box'); if (!el) return;
  api('/api/m/activity?days=' + teamDays + '&date=' + ymd()).then(function (d) {
    var total = d.reps.reduce(function (t, r) { return t + r.visits; }, 0);
    el.innerHTML = '<div class="h2">Team ' + (teamDays === 1 ? 'today' : 'this week') + ' · ' + plural(total, 'visit') +
      '<button class="link" onclick="teamDays=' + (teamDays === 1 ? 7 : 1) + ';loadTeamBox()">' + (teamDays === 1 ? 'Last 7 days' : 'Today') + '</button></div>' +
      '<div class="card list">' + d.reps.map(function (r) {
        return '<div class="row"><div class="grow t1">' + esc(r.rep) + '</div><span class="t2">' + plural(r.accounts, 'account') + '</span><span class="pill ' + (r.visits ? 'navy' : '') + '">' + r.visits + '</span></div>';
      }).join('') + '</div>' +
      (d.recent.length ? '<div class="h2" style="margin-top:14px">Latest visits</div><div class="card list">' + d.recent.slice(0, 8).map(function (c) {

// ── Stops ────────────────────────────────────────────────────────
function addToToday(accountId) {
  var b = $('#add-today'); if (b) b.disabled = true;
  api('/api/planner/items', { method: 'POST', body: { planned_date: ymd(), item_type: 'stop', account_id: accountId } })
    .then(function (r) {
      if (b) { b.textContent = '✓ On today\'s stops'; }
      toast(r.duplicate ? (r.planned_date === ymd() ? 'Already on today\'s stops' : 'Already planned ' + fmtDate(r.planned_date)) : 'Added to today\'s stops');
    })
    .catch(function (e) { if (b) b.disabled = false; toast(e.message, true); });
}
function removeStop(id, btn) {
  if (btn) btn.disabled = true;
  api('/api/planner/items/' + id, { method: 'DELETE' }).then(function () { toast('Stop removed'); route(); })
    .catch(function (e) { if (btn) btn.disabled = false; toast(e.message, true); });
}

function showAccounts() {
  setTitle('Accounts');
  var m = location.hash.match(/\?q=([^&]*)/); if (m) acctState.q = decodeURIComponent(m[1]);
  view('<div class="search" style="margin-bottom:10px">' + ICON.search +

    '<div class="row" style="margin-bottom:14px"><div class="seg grow" role="group" aria-label="Which accounts">' +
    '<button data-group="scope" data-v="team" aria-pressed="' + (acctState.scope === 'team') + '">All team</button>' +
    '<button data-group="scope" data-v="mine" aria-pressed="' + (acctState.scope === 'mine') + '">Mine</button>' +
    '<button data-group="scope" data-v="cold" aria-pressed="' + (acctState.scope === 'cold') + '">Going cold</button></div>' +
    '<button class="btn sm gold" onclick="newAccountSheet()">+ New</button></div><div id="acct-list"></div>');
  var input = $('#acct-q'); var t;
  input.addEventListener('input', function () { clearTimeout(t); t = setTimeout(function () { acctState.q = input.value.trim(); loadAccounts(); }, 250); });
  $$('[data-group="scope"]').forEach(function (b) { b.onclick = function () { press(b, 'scope'); acctState.scope = b.dataset.v; loadAccounts(); }; });
  loadAccounts();
}
var acctReq = 0;
function loadAccounts() {
  var el = $('#acct-list'); if (!el) return; var my = ++acctReq;
  if (acctState.scope === 'cold') { loadColdAccounts(el, my); return; }
  el.innerHTML = '<div class="skel"></div><div class="skel"></div><div class="skel"></div>';
  api('/api/m/accounts?scope=' + acctState.scope + '&q=' + encodeURIComponent(acctState.q)).then(function (rows) {
    if (my !== acctReq) return;
    if (!rows.length) { el.innerHTML = '<div class="card empty">' + (acctState.q ? 'No accounts match "' + esc(acctState.q) + '".' : 'No accounts yet.') +
      '<br><button class="btn pri" onclick="newAccountSheet()">Add an account</button></div>'; return; }
    el.innerHTML = '<div class="card list">' + rows.map(function (a) {
      return '<a class="tap row" href="#account/' + a.id + '"><div class="grow"><div class="t1">' + esc(a.company) + '</div>' +
        '<div class="t2">' + esc([a.city && (a.city + (a.state ? ', ' + a.state : '')), a.owner].filter(Boolean).join(' · ')) + '</div>' +
        '<div class="t2">' + (a.last_visit ? 'Last visit ' + esc(fmtDate(a.last_visit)) : 'Not visited yet') + '</div></div>' + ICON.chev + '</a>';
    }).join('') + '</div>' + (rows.length >= 60 ? '<div class="t2" style="text-align:center;margin-top:10px">Showing first 60. Search to narrow it down.</div>' : '');
  }).catch(function (e) { if (my === acctReq) el.innerHTML = '<div class="card err">Couldn\'t load accounts. <button class="btn sm pri" onclick="loadAccounts()">Retry</button></div>'; });
}
function newAccountSheet() {
  openSheet('<h2>New account</h2>' +

    '<div class="field"><label for="na-cat">Type</label><select id="na-cat">' +

function saveAccount() {
  var co = $('#na-co').value.trim(); if (!co) { toast('Add the company name', true); return; }
  var b = $('#na-save'); b.disabled = true; b.textContent = 'Saving…';
  api('/api/m/accounts', { method: 'POST', body: { company: co, city: $('#na-city').value, state: $('#na-st').value, phone: $('#na-ph').value, category: $('#na-cat').value } })
    .then(function (r) { closeSheet(); toast('Account added'); location.hash = '#account/' + r.id; })
    .catch(function (e) {
      b.disabled = false; b.textContent = 'Save account';
      if (e.status === 409 && e.body && e.body.id) { closeSheet(); toast('Already in RepRoute. Opening it.'); location.hash = '#account/' + e.body.id; }
      else toast(e.message, true);
    });
}

// ── Dictation (Safari/Chrome speech recognition) ─────────────────
var REC = null;
function toggleDictation() {
  if (REC) { stopDictation(); return; }
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { toast('Use the mic on your keyboard to dictate', false); $('#lg-notes').focus(); return; }
  var ta = $('#lg-notes'), base = ta.value ? ta.value.replace(/\s*$/, ' ') : '';
  REC = new SR(); REC.lang = 'en-US'; REC.continuous = true; REC.interimResults = true;
  REC.onresult = function (e) { var s = ''; for (var i = 0; i < e.results.length; i++) s += e.results[i][0].transcript; ta.value = base + s; };
  REC.onerror = function (e) { if (e.error === 'not-allowed') toast('Allow the microphone to dictate', true); stopDictation(); };
  REC.onend = function () { stopDictation(); };
  try { REC.start(); $('#lg-mic').classList.add('rec'); $('#lg-mic').setAttribute('aria-label', 'Stop dictating'); } catch (e) { REC = null; }
}
function stopDictation() { if (REC) { try { REC.stop(); } catch (e) {} REC = null; } var m = $('#lg-mic'); if (m) { m.classList.remove('rec'); m.setAttribute('aria-label', 'Dictate notes'); } }

// ── Business card scan → contact form ─────────────────────────────
function shrinkImage(file, maxSide) {
  return new Promise(function (resolve, reject) {
    var img = new Image(), url = URL.createObjectURL(file);
    img.onload = function () {
      var k = Math.min(1, maxSide / Math.max(img.width, img.height));
      var c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('Couldn\'t open that photo')); };
    img.src = url;
  });
}
function scanCard(input) {
  var f = input.files && input.files[0]; if (!f) return;
  var lab = $('#ct-scan'); lab.firstChild.nodeValue = 'Reading card…';
  shrinkImage(f, 1600).then(function (dataUrl) {
    return api('/api/voice/scan-card', { method: 'POST', body: { image: dataUrl, mimeType: 'image/jpeg' } });
  }).then(function (r) {
    var x = r.extracted || {};
    if (r.error && !Object.keys(x).length) throw new Error(r.error);
    var set = function (id, v) { var el = $('#' + id); if (el && v && !el.value) el.value = v; };
    set('ct-name', x.contact_name || [x.first_name, x.last_name].filter(Boolean).join(' '));
    set('ct-title', x.title); set('ct-phone', x.mobile || x.phone); set('ct-email', x.email);
    lab.firstChild.nodeValue = 'Scan another card';
    toast('Card read. Check the details and save.');
  }).catch(function (e) { lab.firstChild.nodeValue = 'Scan a business card'; toast(e.message || 'Couldn\'t read the card', true); })
    .then(function () { input.value = ''; });
}

    .catch(function (e) { btn.disabled = false; toast(e.message, true); });
}
function winbackDraft(id, channel, btn) {
  var old = btn.textContent; btn.disabled = true; btn.textContent = 'Drafting…';
  api('/api/agents/winback/draft', { method: 'POST', body: { account_id: id, channel: channel } }).then(function (d) {
    btn.disabled = false; btn.textContent = old;
    openSheet('<h2>' + (channel === 'text' ? 'Check-in text' : 'Check-in email') + '</h2><div id="wb-draft"></div>');
    renderDraft($('#wb-draft'), d);
  }).catch(function (e) { btn.disabled = false; btn.textContent = old; toast(e.message, true); });
}
function quoteNudge(id, btn) {
  btn.disabled = true; btn.textContent = 'Drafting…';
  api('/api/agents/quote-nudge', { method: 'POST', body: { quote_id: id } }).then(function (d) {
    btn.classList.add('hidden'); renderDraft($('#qs-draft'), d);
    $('#qs-draft').scrollIntoView({ block: 'start', behavior: 'smooth' });
  }).catch(function (e) { btn.disabled = false; btn.textContent = 'Draft a follow-up email'; toast(e.message, true); });
}


// ════════════════════════════════════════════════════════════════
// LEAD FINDER: same search as the desktop Today screen
// (/api/morning/daily-leads, one call per segment, merged and ranked)
// ════════════════════════════════════════════════════════════════
var LF_BRANDS = [['BOSS Products', 'BOSS'], ['ShurTape', 'ShurTape'], ['Alum-A-Pole', 'Alum-A-Pole']];
var LF_SEGMENTS = [
  ['Deck Distributor/Dealer', 'Deck Distributors'], ['Roofing Distributor', 'Roofing Distributors'], ['Siding Distributor', 'Siding Distributors'],
  ['Lumber / Building Supply', 'Lumber / Building Supply'], ['Construction Fasteners', 'Construction Fasteners'], ['Division 10 Dealer', 'Division 10 Dealers'],
  ['Window/Door Installer', 'Window / Door'], ['Deck Contractor', 'Deck Contractors'], ['Roofing Contractor', 'Roofing Contractors'],
  ['Siding Contractor', 'Siding Contractors'], ['Cornice Contractor', 'Cornice Contractors'], ['Spray Foam Contractor', 'Spray Foam Contractors'], ['Glass Shop', 'Glass Shops']
];
var LFK = 'rr_lead_finder_v1';
function lfLoad() { try { return JSON.parse(localStorage.getItem(LFK) || '{}'); } catch (e) { return {}; } }
function lfSave(st) { try { localStorage.setItem(LFK, JSON.stringify(st)); } catch (e) {} }
var LF = null;
function showLeads() {
  setTitle('Lead Finder', true);
  LF = lfLoad();
  LF.brands = LF.brands || ['BOSS Products', 'ShurTape', 'Alum-A-Pole'];
  LF.segments = LF.segments || ['Deck Distributor/Dealer', 'Roofing Distributor', 'Siding Distributor'];
  LF.city = LF.city || window._leadCityDefault || (ME && ME.territory) || '';
  LF.shown = LF.shown || []; LF.leads = LF.leads || [];
  view('<div class="field"><label for="lf-city">City</label><input id="lf-city" placeholder="e.g. Norcross GA" autocomplete="off" autocapitalize="words" value="' + esc(LF.city) + '"></div>' +
    '<div class="field"><span class="lbl">Brands</span><div class="chips">' + LF_BRANDS.map(function (b) {
      return '<button class="chip" data-lfb="' + esc(b[0]) + '" aria-pressed="' + (LF.brands.indexOf(b[0]) >= 0) + '" onclick="toggle(this)">' + esc(b[1]) + '</button>'; }).join('') + '</div></div>' +
    '<div class="field"><span class="lbl">Segments <span style="font-weight:500">(distributors first)</span></span><div class="chips">' + LF_SEGMENTS.map(function (g) {
      return '<button class="chip" data-lfs="' + esc(g[0]) + '" aria-pressed="' + (LF.segments.indexOf(g[0]) >= 0) + '" onclick="toggle(this)">' + esc(g[1]) + '</button>'; }).join('') + '</div></div>' +
    '<div class="btns" style="margin-bottom:16px"><button class="btn gold" id="lf-go" onclick="findLeads(false)">Find leads</button>' +
    '<button class="btn" id="lf-more" onclick="findLeads(true)"' + (LF.leads.length ? '' : ' disabled') + '>10 new ones</button></div>' +
    '<div id="lf-out"></div>');
  renderLeads();
}
function findLeads(more) {
  var city = $('#lf-city').value.trim();
  var brands = $$('[data-lfb][aria-pressed="true"]').map(function (b) { return b.dataset.lfb; });
  var segs = $$('[data-lfs][aria-pressed="true"]').map(function (b) { return b.dataset.lfs; });
  if (!city) { toast('Enter a city first, like Norcross GA', true); $('#lf-city').focus(); return; }
  if (!brands.length) { toast('Pick at least one brand', true); return; }
  if (!segs.length) { toast('Pick at least one segment', true); return; }
  if (!more || city !== LF.city) LF.shown = [];
  LF.city = city; LF.brands = brands; LF.segments = segs;
  var go = $('#lf-go'), mo = $('#lf-more'); go.disabled = true; mo.disabled = true; go.textContent = 'Searching…';
  $('#lf-out').innerHTML = '<div class="t2" style="margin-bottom:10px">Searching ' + segs.length + ' segment' + (segs.length === 1 ? '' : 's') + ' around ' + esc(city) + '…</div><div class="skel"></div><div class="skel"></div><div class="skel"></div>';
  var all = [], seen = {}, seenFlag = {}; LF.shown.forEach(function (k) { seen[k] = 1; });
  var errMsg = null;
  var chain = segs.reduce(function (p, seg) {
    return p.then(function () {
      return api('/api/morning/daily-leads', { method: 'POST', body: { city: city, brands: brands, channel: seg, shown_place_ids: LF.shown, shown_names: [] } })
        .then(function (d) {
          (d.leads || []).forEach(function (l) {
            l.segment = seg; var k = l.place_id || (l.company || '').toLowerCase();
            // Leads a teammate already has always show (flagged), but only once.
            if (l.already_contacted) { if (!seenFlag[k]) { seenFlag[k] = 1; all.push(l); } return; }
            if (!seen[k]) { seen[k] = 1; all.push(l); }
          });
        }).catch(function (e) { errMsg = e.message; });
    });
  }, Promise.resolve());
  chain.then(function () {
    go.disabled = false; go.textContent = 'Find leads';
    all.sort(function (a, b) { return (b.opportunity_score || 0) - (a.opportunity_score || 0); });
    var block = /paint|handyman|landscap|lawn care|pressure wash|gutter clean|house clean/i;
    var clean = all.filter(function (l) {
      if (l.already_contacted) return false;
      if (block.test(l.company || '')) return false;
      if (/window|door/i.test(l.segment) && /garage|overhead door/i.test(l.company || '')) return false;
      return true;
    }).slice(0, 10);
    LF.leads = clean.concat(all.filter(function (l) { return l.already_contacted; }));
    clean.forEach(function (l) { if (l.place_id) LF.shown.push(l.place_id); });
    lfSave(LF); mo.disabled = !LF.leads.length;
    if (!LF.leads.length && errMsg) { $('#lf-out').innerHTML = '<div class="card err">Lead search failed: ' + esc(errMsg) + '</div>'; return; }
    renderLeads();
    var outEl = $('#lf-out'); if (outEl) outEl.scrollIntoView({ block: 'start', behavior: 'smooth' });
    if (clean.length) toast(plural(clean.length, 'new lead') + ' found');
  });
}
function renderLeads() {
  var el = $('#lf-out'); if (!el) return;
  if (!LF.leads.length) { el.innerHTML = '<div class="card empty">Pick brands and segments, enter a city, and tap Find leads.</div>'; return; }
  el.innerHTML = '<div class="h2">' + plural(LF.leads.filter(function (l) { return !l.already_contacted; }).length, 'lead') + ' near ' + esc(LF.city) + '</div>' +
    '<div class="card list">' + LF.leads.map(function (l, i) {
      var seg = (LF_SEGMENTS.filter(function (g) { return g[0] === l.segment; })[0] || [0, l.category || ''])[1];
      var meta = [seg, l.distance_miles != null ? Math.round(l.distance_miles) + ' mi' : '', l.rating ? '★ ' + l.rating + ' (' + (l.reviews || 0) + ')' : ''].filter(Boolean).join(' · ');
      return '<div><div class="row" style="align-items:flex-start"><div class="grow"><div class="t1">' + esc(l.company) + '</div>' +
        '<div class="t2">' + esc(meta) + '</div>' + (l.address ? '<div class="t2">' + esc(l.address) + '</div>' : '') +
        (l.already_contacted ? '<div style="margin-top:4px"><span class="pill warn">Already in RepRoute' + (l.contacted_by ? ' · ' + esc(l.contacted_by) : '') + '</span></div>' : '') + '</div>' +
        (l.opportunity_score ? '<span class="pill ' + (l.opportunity_score >= 8 ? 'ok' : l.opportunity_score >= 6 ? 'navy' : '') + '">' + l.opportunity_score + '/10</span>' : '') + '</div>' +
        '<div class="btns" style="margin-top:10px">' +
        (l.phone ? '<a class="btn sm" href="tel:' + esc(digits(l.phone)) + '">Call</a>' : '') +
        '<a class="btn sm" href="' + esc(mapsUrl({ address: l.address, company: l.company })) + '" target="_blank" rel="noopener">Go</a>' +
        (l.already_contacted ? '' : '<button class="btn sm" id="lf-save-' + i + '" onclick="saveLead(' + i + ',false)">Save</button>' +
          '<button class="btn sm pri" onclick="saveLead(' + i + ',true)">Log visit</button>') + '</div></div>';
    }).join('') + '</div>' +
    '<div class="t2" style="margin-top:10px;text-align:center">Saving adds the lead to your accounts. "10 new ones" skips the leads you\'ve already seen.</div>';
}
// Save a lead as an account (same endpoint as desktop), then find its id.
function saveLead(i, thenLog) {
  var l = LF.leads[i]; if (!l) return;
  var b = $('#lf-save-' + i); if (b) { b.disabled = true; b.textContent = 'Saving…'; }
  var cat = /Distributor|Dealer|Lumber|Fasteners|Division 10/.test(l.segment || '') ? 'Distributor' : 'Commercial Contractor';
  api('/api/ai/leads/save', { method: 'POST', body: { leads: [{
    company: l.company, category: l.category || cat, city: l.city || '', state: l.state || 'GA', phone: l.phone || null,
    website: l.website || null, address: l.address || null, products: l.products || null,
    data_status: 'Unvetted', source: 'Distribution Finder' }] } })
    .then(function () { return api('/api/m/accounts?scope=mine&limit=5&q=' + encodeURIComponent(l.company)); })
    .then(function (rows) {
      var a = rows.filter(function (r) { return (r.company || '').toLowerCase() === (l.company || '').toLowerCase(); })[0] || rows[0];
      l.saved = true; l.account_id = a && a.id; lfSave(LF);
      if (b) { b.textContent = '✓ Saved'; }
      if (!a) { toast('Saved to your accounts'); return; }
      if (thenLog) location.hash = '#log/' + a.id; else toast('Saved. It\'s in your accounts now.');
    })
    .catch(function (e) { if (b) { b.disabled = false; b.textContent = 'Save'; } toast(e.message, true); });
}

    full('recap', 'Daily Recap') + full('weekly-report', 'Weekly Report') + full('quotes', 'Quotes (full editor)') +
    full('samples', 'Samples') + full('manufacturers', 'Manufacturers') + full('opportunities', 'Opportunities') + full('deals', 'Deal Pipeline') +

Promise.all([api('/api/m/me'), api('/api/m/team').catch(function () { return []; })]).then(function (r) { ME = r[0]; TEAM = r[1]; })
  .catch(function () {}).then(function () { setOnline(); route(); });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(function () {});
